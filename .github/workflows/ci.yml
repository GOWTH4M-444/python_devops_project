name: Python DevOps Project CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run formatting check
        run: black --check app tests

      - name: Run linting
        run: flake8 app tests --max-line-length=120

      - name: Setup Environment
        run: |
          cp configs/.env.example configs/.env

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing -v

      - name: Start Mock Application Service
        run: |
          python mock_service.py &
          sleep 3

      - name: Run validation workflow
        run: python -m app.main all

      - name: Upload Test & Execution Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-reports
          path: |
            reports/
            logs/
